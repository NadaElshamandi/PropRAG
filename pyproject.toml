[project]
name = "proprag"
version = "0.1.0"
description = "RAG-enabled Property Management System for Alexandria real estate"
readme = "AGENTS.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.44.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.1",
    "supabase>=2.4.6",
    "pgvector>=0.2.5",
    "openai>=1.30.1",
    "anthropic>=0.26.1",
    "prefect>=2.19.5",
    "python-dotenv>=1.0.1",
    "tenacity>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scrapers"]

[dependency-groups]
dev = ["ruff>=0.6.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"
